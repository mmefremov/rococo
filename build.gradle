plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.boot' version '3.5.8' apply false
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    repositories {
        mavenCentral()
        maven { url = 'https://repo.spring.io/milestone' }
        maven { url = 'https://repo.spring.io/snapshot' }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    compileJava.options.encoding = 'UTF-8'

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

def springGrpcVersion = project.properties['springGrpcVersion'] ?: '0.4.0-SNAPSHOT'

def springBootServiceNames = [
        'rococo-artist',
        'rococo-auth',
        'rococo-gateway',
        'rococo-geo',
        'rococo-museum',
        'rococo-painting',
        'rococo-userdata'
]

def grpcServiceNames = [
        'rococo-artist',
        'rococo-geo',
        'rococo-museum',
        'rococo-painting',
        'rococo-userdata'
]

dependencyManagement {
    imports {
        mavenBom "org.springframework.grpc:spring-grpc-dependencies:${springGrpcVersion}"
    }
}

springBootServiceNames.each { serviceName ->
    project(":${serviceName}") {
        afterEvaluate {
            tasks.named('jar') { enabled = false }
        }
    }
}

tasks.register('dockerBuildAll') {
    group = 'docker'
    description = 'Builds Docker images for all services'
    dependsOn springBootServiceNames.collect { "dockerBuild_${it - 'rococo-'}" }
}

springBootServiceNames.each { serviceName ->
    def svc = serviceName - 'rococo-'
    tasks.register("dockerBuild_${svc}", Exec) {
        group = 'docker'
        dependsOn ":${serviceName}:build"
        commandLine 'docker', 'build',
                '--build-arg', "SERVICE_NAME=${svc}",
                '-t', "${serviceName}:latest", '.'
    }
}

subprojects {
    group = 'io.efremov'

    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'io.grpc') {
                details.useVersion '1.75.0'
            }
        }
    }

    ext {
        springBootVersion = '3.5.8'
        lombokVersion = '1.18.42'
        postgresDriverVersion = '42.7.7'
        flywayVersion = '11.20.0'
        grpcVersion = '1.75.0'
        protobufPluginVersion = '0.9.6'
        protobufVersion = '4.32.0'
        grpcSpringBootStarterVersion = '3.1.0.RELEASE'
        jspecifyVersion = '1.0.0'
        jakartaAnnotationVersion = '1.3.5'
    }

    dependencies {
        implementation "org.jspecify:jspecify:${jspecifyVersion}"
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.grpc:spring-grpc-dependencies:${springGrpcVersion}"
        }
        dependencies {
            dependency "com.google.protobuf:protobuf-java:${protobufVersion}"
        }
    }

    if (name in springBootServiceNames) {
        dependencies {
            annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
            compileOnly "org.projectlombok:lombok:${lombokVersion}"
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
        }
        tasks.named('test') { useJUnitPlatform() }
        tasks.register('printVersion') { doLast { println version } }
    }

    if (name in grpcServiceNames) {
        dependencies {
            implementation project(':rococo-grpc-common')
            implementation project(':rococo-common')
            implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
            implementation "org.flywaydb:flyway-core:${flywayVersion}"
            implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
            implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
            implementation "io.grpc:grpc-protobuf:${grpcVersion}"
            implementation "io.grpc:grpc-stub:${grpcVersion}"
            implementation "net.devh:grpc-server-spring-boot-starter:${grpcSpringBootStarterVersion}"
            runtimeOnly "org.postgresql:postgresql:${postgresDriverVersion}"
        }
    }
}
